name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check required variables
        env:
          VITE_RESEARCH_API_URL: ${{ vars.VITE_RESEARCH_API_URL }}
        run: |
          if [ -z "$VITE_RESEARCH_API_URL" ]; then
            echo "Set the VITE_RESEARCH_API_URL repository variable to an explicit HTTPS API base (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
      - name: Build
        env:
          VITE_RESEARCH_SECURITY_PROVIDER: azure
          VITE_RESEARCH_API_URL: ${{ vars.VITE_RESEARCH_API_URL }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
